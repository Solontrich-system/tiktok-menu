<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norman’s Weirdest Shop – Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#cdb8ff; --ink:#1b1038; --pink:#ff4f9a; --lemon:#ffe45c; --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a1a55; --ink:#f4eeff; --card:#3b2677; }
}
:root[data-theme="dark"]{ --bg:#2a1a55; --ink:#f4eeff; --card:#3b2677; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;padding:36px 20px 48px}
main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:22px}
header{text-align:center}
.logo{display:block;width:100%;max-width:100%;height:auto;margin:0 auto 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.badge{width:96px;height:96px;margin:0 auto 18px;background:var(--lemon);border:4px solid var(--ink);
  border-radius:58% 42% 55% 45% / 48% 58% 42% 52%;display:grid;place-items:center;
  box-shadow:6px 6px 0 var(--pink);animation:wobble 5s ease-in-out infinite}
.badge span{font-weight:800;font-size:44px;color:#1b1038;line-height:1}
h1{margin:0;font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.02em}
p.tag{margin:12px 0 0;font-size:17px;font-weight:500;line-height:1.35}
nav{display:flex;flex-direction:column;gap:18px;margin-top:8px}
a.link{display:flex;flex-direction:column;gap:4px;padding:20px 22px;text-decoration:none;color:var(--ink);
  background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease}
a.link:nth-child(1){transform:rotate(-1.2deg);background:var(--lemon);color:#1b1038;border-color:#1b1038;box-shadow:7px 7px 0 var(--pink)}
a.link:nth-child(2){transform:rotate(1deg)}
a.link:hover,a.link:focus-visible{transform:rotate(0) translate(-2px,-2px);box-shadow:10px 10px 0 var(--pink)}
a.link:active{transform:rotate(0) translate(5px,5px);box-shadow:2px 2px 0 var(--pink)}
a.link:focus-visible{outline:4px solid var(--pink);outline-offset:4px}
.name{font-size:26px;font-weight:800;letter-spacing:-.01em}
.desc{font-size:16px;font-weight:500;opacity:.85}
footer{text-align:center;font-size:14px;font-weight:500;opacity:.75;margin-top:6px}
@keyframes wobble{0%,100%{border-radius:58% 42% 55% 45% / 48% 58% 42% 52%;transform:rotate(-3deg)}
  50%{border-radius:42% 58% 45% 55% / 58% 42% 52% 48%;transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){.badge{animation:none}a.link{transition:none}}
</style>
</head>
